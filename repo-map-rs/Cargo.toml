[package]
name = "repo-map-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-python = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-go = "0.20"
tree-sitter-swift = "0.4"
tree-sitter-java = "0.20"
# Focus on the core languages that work with tree-sitter 0.20
# Additional languages can be added later with compatible versions:
# tree-sitter-php = "0.22"
# tree-sitter-lua = "0.1"
# tree-sitter-kotlin = "0.3"
# tree-sitter-c = "0.21"
# tree-sitter-cpp = "0.22"
# tree-sitter-c-sharp = "0.21"
# tree-sitter-ruby = "0.21"
# tree-sitter-scala = "0.21"
walkdir = "2.4"
ignore = "0.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.8"
