[package]
name = "aider-repo-map"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# Update to latest stable tree-sitter crates
# Core
tree-sitter = "0.24"
# Popular languages (uncommented and aligned to 0.24-compatible versions)
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-swift = "0.6"
tree-sitter-java = "0.23"
# Additional languages uncommented per request (latest available on crates.io)
tree-sitter-php = "0.23"
tree-sitter-lua = "0.2"
tree-sitter-kotlin = "0.3"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-scala = "0.23"

walkdir = "2.5"
ignore = "0.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"